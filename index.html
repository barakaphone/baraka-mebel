<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00297D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Baraka Mebel</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="96x96" href="img/favicon-v3.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon-v3.png">
<meta name="apple-mobile-web-app-title" content="Baraka Mebel">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="boot" class="center"><div class="authbox"><div class="logo big"><img src="img/logo-mebel.png" alt="Baraka"></div><p class="sub" id="bootMsg">Yuklanmoqda…</p></div></div>

<!-- Tizimni birinchi sozlash -->
<div id="setup" class="center hidden">
  <form class="authbox" id="setupForm" autocomplete="off">
    <div class="logo big"><img src="img/logo-mebel.png" alt="Baraka"></div>
    <h2>Tizimni sozlash</h2>
    <p class="sub">Bir martalik. Siz tizim egasi (bosh admin) bo'lasiz.</p>
    <div class="field"><label>F.I.O.</label><input class="inp" id="sName" required maxlength="80"></div>
    <div class="field"><label>Telefon raqami (login)</label><div id="sPhoneWrap"></div></div>
    <div class="field"><label>Parol (kamida 12 belgi)</label><input class="inp" id="sPass" type="password" required minlength="12" autocomplete="new-password"></div>
    <div class="field"><label>Parolni takrorlang</label><input class="inp" id="sPass2" type="password" required minlength="12" autocomplete="new-password"></div>
    <label class="showpw"><input type="checkbox" data-showpw="sPass,sPass2"> Parolni ko'rsatish</label>
    <div class="field"><label>Birinchi filial nomi</label><input class="inp" id="sBranch" required maxlength="60" value="Asosiy filial"></div>
    <div class="err hidden" id="setupErr"></div>
    <button class="btn pri block" id="setupBtn">Sozlashni boshlash</button>
  </form>
</div>

<!-- Kirish -->
<div id="login" class="center hidden">
  <form class="authbox" id="loginForm">
    <div class="logo big"><img src="img/logo-mebel.png" alt="Baraka"></div>
    <p class="sub">Xodimlar uchun kirish</p>
    <div class="field"><label>Telefon raqami</label><div id="lPhoneWrap"></div></div>
    <div class="field"><label>Parol</label><input class="inp" id="lPass" type="password" required autocomplete="current-password"></div>
    <label class="showpw"><input type="checkbox" data-showpw="lPass"> Parolni ko'rsatish</label>
    <div class="err hidden" id="loginErr"></div>
    <button class="btn pri block" id="loginBtn">Kirish</button>
    <button type="button" class="btn sec block hidden" id="instLogin" style="margin-top:10px">📲 Ilovani telefonga o'rnatish</button>
  </form>
</div>

<!-- Ilova -->
<div id="app" class="hidden">
  <header class="bar">
    <div class="bar-in">
      <div class="logo"><img src="img/logo-mebel.png" alt="Baraka"></div>
      <div class="who"><b id="meName"></b><span id="meRole"></span></div>
      <button class="icon-btn bell hidden" id="bellBtn" title="Bildirishnomalar" aria-label="Bildirishnomalar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="bell-cnt hidden" id="bellCnt"></span></button>
      <button class="icon-btn" id="logoutBtn" title="Profil va chiqish" aria-label="Profil va chiqish"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main class="page" id="page"></main>
</div>

<div id="toast" class="toast" role="status"></div>
<script src="js/model.js"></script>
<script src="js/engine.js"></script>
<script src="js/kalkulyator.js"></script>
<script type="module" src="js/install.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
